name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Must precede setup-node: its pnpm cache lookup needs the pnpm binary.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Test packed package and declarations
        run: pnpm test:package
